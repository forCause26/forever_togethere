<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Chance Meeting</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #0d0a0f;
        font-family: "Cormorant Garamond", Georgia, serif;
        overflow: hidden;
        position: relative;
      }
      .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        opacity: 0;
        animation: twinkle linear infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 0.6;
        }
      }

      body::before {
        content: "";
        position: fixed;
        width: min(700px, 120vw);
        height: min(700px, 120vw);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(180, 30, 60, 0.09) 0%,
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        animation: ambientBreath 3s ease-in-out infinite;
      }
      @keyframes ambientBreath {
        0%,
        100% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.08);
        }
      }

      .fade-overlay {
        position: fixed;
        inset: 0;
        background: #0d0a0f;
        opacity: 0;
        pointer-events: none;
        z-index: 100;
        transition: opacity 0.7s ease;
      }
      .fade-overlay.active {
        opacity: 1;
        pointer-events: all;
      }

      .scene-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 480px;
        padding: 0 16px;
      }
      .scene {
        position: relative;
        width: 100%;
        height: clamp(200px, 55vw, 310px);
      }
      .ground {
        position: absolute;
        bottom: 30px;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(200, 100, 120, 0.3),
          transparent
        );
      }
      .figure {
        position: absolute;
        bottom: 31px;
      }
      .figure-boy {
        left: 4%;
        animation:
          boyWalk 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s,
          boyClose 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 2.2s;
      }
      .figure-girl {
        right: 4%;
        animation:
          girlWalk 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards 0.4s,
          girlClose 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards 2.2s;
      }
      @keyframes boyWalk {
        0% {
          transform: translateX(-20vw);
        }
        100% {
          transform: translateX(0);
        }
      }
      @keyframes girlWalk {
        0% {
          transform: translateX(20vw);
        }
        100% {
          transform: translateX(0);
        }
      }
      @keyframes boyClose {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(min(58px, 13vw));
        }
      }
      @keyframes girlClose {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(calc(-1 * min(58px, 13vw)));
        }
      }
      .char-svg {
        width: clamp(50px, 16vw, 80px);
        height: clamp(94px, 30vw, 150px);
        overflow: visible;
      }
      .boy-arm-L {
        transform-origin: 20px 62px;
        animation: boyArmL 0.7s ease forwards 2.7s;
      }
      .boy-arm-R {
        transform-origin: 60px 62px;
        animation: boyArmR 0.7s ease forwards 2.7s;
      }
      .girl-arm-L {
        transform-origin: 22px 58px;
        animation: girlArmL 0.7s ease forwards 2.7s;
      }
      .girl-arm-R {
        transform-origin: 58px 58px;
        animation: girlArmR 0.7s ease forwards 2.7s;
      }
      @keyframes boyArmL {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(-15deg) translateY(-4px);
        }
      }
      @keyframes boyArmR {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(20deg) translateX(-6px) translateY(-2px);
        }
      }
      @keyframes girlArmL {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(-18deg) translateY(-4px);
        }
      }
      @keyframes girlArmR {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(22deg) translateX(6px) translateY(-2px);
        }
      }
      .hug-glow {
        position: absolute;
        bottom: clamp(40px, 12vw, 50px);
        left: 50%;
        transform: translateX(-50%);
        width: clamp(70px, 25vw, 110px);
        height: clamp(80px, 28vw, 120px);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(230, 90, 130, 0.22) 0%,
          transparent 70%
        );
        opacity: 0;
        pointer-events: none;
        animation: glowIn 1.2s ease forwards 3s;
      }
      @keyframes glowIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .heart-float {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        color: #e8304e;
        animation: heartUp 2.2s ease-out infinite;
      }
      .heart-float:nth-child(1) {
        left: 47%;
        bottom: 55%;
        font-size: clamp(7px, 2.5vw, 11px);
        animation-delay: 3.1s;
      }
      .heart-float:nth-child(2) {
        left: 52%;
        bottom: 55%;
        font-size: clamp(11px, 4vw, 17px);
        animation-delay: 3.7s;
      }
      .heart-float:nth-child(3) {
        left: 43%;
        bottom: 55%;
        font-size: clamp(6px, 2vw, 9px);
        animation-delay: 4.3s;
      }
      .heart-float:nth-child(4) {
        left: 57%;
        bottom: 55%;
        font-size: clamp(8px, 3vw, 13px);
        animation-delay: 4.9s;
      }
      .heart-float:nth-child(5) {
        left: 50%;
        bottom: 55%;
        font-size: clamp(5px, 2vw, 8px);
        animation-delay: 5.5s;
      }
      @keyframes heartUp {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.5);
        }
        15% {
          opacity: 0.9;
          transform: translateY(-12px) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-80px) scale(0.5) rotate(10deg);
        }
      }

      .letter-drop {
        position: absolute;
        top: clamp(4px, 1.5vw, 8px);
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        cursor: pointer;
        z-index: 10;
        display: none;
        animation:
          letterFall 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          letterFloat 2s ease-in-out 1.1s infinite;
      }
      .letter-drop:hover {
        filter: drop-shadow(0 0 14px rgba(232, 48, 78, 0.6));
      }
      .letter-drop:hover .env-body {
        fill: #f5c0cc;
      }
      .letter-drop.flying {
        animation: letterFly 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        pointer-events: none;
      }
      @keyframes letterFly {
        0% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) scale(1) rotate(0deg);
        }
        35% {
          opacity: 1;
          transform: translateX(-50%) translateY(-28px) scale(1.18)
            rotate(-5deg);
        }
        100% {
          opacity: 0;
          transform: translateX(-50%) translateY(-170px) scale(0.35)
            rotate(10deg);
        }
      }
      @keyframes letterFall {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(-50px) rotate(-10deg);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0) rotate(0deg);
        }
      }
      @keyframes letterFloat {
        0%,
        100% {
          transform: translateX(-50%) translateY(0);
        }
        50% {
          transform: translateX(-50%) translateY(-7px);
        }
      }
      .env-svg {
        width: clamp(38px, 12vw, 54px);
        height: auto;
      }

      .caption {
        font-size: clamp(10px, 3vw, 13px);
        letter-spacing: 0.25em;
        color: rgba(220, 160, 175, 0.5);
        text-transform: uppercase;
        opacity: 0;
        animation: fadeUp 1s ease forwards 1.2s;
        margin-top: clamp(10px, 3vw, 16px);
        text-align: center;
      }
      .tap-hint {
        font-size: clamp(10px, 2.8vw, 12px);
        letter-spacing: 0.3em;
        color: rgba(220, 140, 160, 0.45);
        text-transform: uppercase;
        opacity: 0;
        margin-top: 8px;
        transition: opacity 0.8s ease;
        text-align: center;
      }
      .tap-hint.show {
        opacity: 1;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="fade-overlay" id="fadeOverlay"></div>
    <div class="stars" id="stars"></div>

    <div class="scene-wrap">
      <div class="scene" id="scene">
        <div class="ground"></div>
        <div class="hug-glow"></div>
        <div class="heart-float">♥</div>
        <div class="heart-float">♥</div>
        <div class="heart-float">♥</div>
        <div class="heart-float">♥</div>
        <div class="heart-float">♥</div>

        <!-- BOY -->
        <div class="figure figure-boy">
          <svg
            class="char-svg"
            viewBox="0 0 80 150"
            xmlns="http://www.w3.org/2000/svg"
          >
            <circle cx="40" cy="22" r="14" fill="#f5c5a0" />
            <ellipse cx="40" cy="11" rx="13" ry="7" fill="#3d2010" />
            <rect x="36" y="34" width="8" height="11" rx="2" fill="#f5c5a0" />
            <path
              d="M20 60 Q20 105 22 122 L38 122 L40 84 L42 122 L58 122 Q60 105 60 60 Q55 55 50 52 L40 56 L30 52 Q25 55 20 60Z"
              fill="#1a1a2e"
            />
            <path d="M36 52 L40 56 L44 52 L43 48 L40 44 L37 48Z" fill="#fff" />
            <path d="M39 50 L40 56 L41 50 L40.5 47Z" fill="#c8203c" />
            <path d="M30 52 L36 52 L40 44 L30 58Z" fill="#2a2a4e" />
            <path d="M50 52 L44 52 L40 44 L50 58Z" fill="#2a2a4e" />
            <g class="boy-arm-L">
              <path
                d="M20 63 Q6 80 14 96"
                stroke="#1a1a2e"
                stroke-width="10"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse
                cx="14"
                cy="98"
                rx="7"
                ry="5"
                fill="#f5c5a0"
                transform="rotate(-15,14,98)"
              />
            </g>
            <g class="boy-arm-R">
              <path
                d="M60 63 Q74 78 68 92"
                stroke="#1a1a2e"
                stroke-width="10"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse
                cx="68"
                cy="94"
                rx="7"
                ry="5"
                fill="#f5c5a0"
                transform="rotate(15,68,94)"
              />
            </g>
            <path
              d="M22 122 L26 142 L34 142 L40 126 L46 142 L54 142 L58 122Z"
              fill="#12122a"
            />
            <ellipse cx="30" cy="142" rx="8" ry="3" fill="#0a0a15" />
            <ellipse cx="50" cy="142" rx="8" ry="3" fill="#0a0a15" />
          </svg>
        </div>

        <!-- GIRL -->
        <div class="figure figure-girl">
          <svg
            class="char-svg"
            viewBox="0 0 80 150"
            xmlns="http://www.w3.org/2000/svg"
          >
            <ellipse cx="40" cy="25" rx="16" ry="20" fill="#5c1a2e" />
            <circle cx="40" cy="22" r="13" fill="#f5c5a0" />
            <path
              d="M27 18 Q28 8 40 8 Q52 8 53 18 Q50 12 40 12 Q30 12 27 18Z"
              fill="#7a2040"
            />
            <path
              d="M27 20 Q22 32 25 40"
              stroke="#5c1a2e"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"
            />
            <path
              d="M53 20 Q58 32 55 40"
              stroke="#5c1a2e"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"
            />
            <rect x="36" y="33" width="8" height="10" rx="2" fill="#f5c5a0" />
            <path
              d="M22 55 Q22 82 24 98 L56 98 Q58 82 58 55 Q52 48 46 44 L40 46 L34 44 Q28 48 22 55Z"
              fill="#c8203c"
            />
            <path
              d="M24 98 Q20 122 18 142 L62 142 Q60 122 56 98Z"
              fill="#d42545"
            />
            <path
              d="M34 44 Q40 50 46 44"
              stroke="#b01830"
              stroke-width="1.5"
              fill="none"
            />
            <g class="girl-arm-L">
              <path
                d="M22 58 Q8 75 16 90"
                stroke="#c8203c"
                stroke-width="9"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse
                cx="16"
                cy="92"
                rx="7"
                ry="5"
                fill="#f5c5a0"
                transform="rotate(-20,16,92)"
              />
            </g>
            <g class="girl-arm-R">
              <path
                d="M58 58 Q72 73 65 87"
                stroke="#c8203c"
                stroke-width="9"
                fill="none"
                stroke-linecap="round"
              />
              <ellipse
                cx="65"
                cy="89"
                rx="7"
                ry="5"
                fill="#f5c5a0"
                transform="rotate(15,65,89)"
              />
            </g>
            <ellipse cx="28" cy="142" rx="7" ry="3" fill="#8b1020" />
            <ellipse cx="52" cy="142" rx="7" ry="3" fill="#8b1020" />
          </svg>
        </div>

        <!-- Letter -->
        <div class="letter-drop" id="letterDrop">
          <svg
            class="env-svg"
            viewBox="0 0 54 42"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              class="env-body"
              x="1"
              y="1"
              width="52"
              height="40"
              rx="3"
              fill="#fdf0f4"
              stroke="#e8a0b0"
              stroke-width="1"
            />
            <path
              d="M1 4 L27 24 L53 4"
              stroke="#e8a0b0"
              stroke-width="1.2"
              fill="none"
            />
            <path
              d="M1 42 L20 22"
              stroke="#e8a0b0"
              stroke-width="0.8"
              fill="none"
            />
            <path
              d="M53 42 L34 22"
              stroke="#e8a0b0"
              stroke-width="0.8"
              fill="none"
            />
            <circle cx="27" cy="34" r="5" fill="#c8203c" opacity="0.7" />
            <text
              x="27"
              y="37.5"
              text-anchor="middle"
              font-size="6"
              fill="#fff"
              font-family="serif"
            >
              ♥
            </text>
          </svg>
        </div>
      </div>

      <p class="caption">we found each other</p>
    </div>

    <script>
      const starsEl = document.getElementById("stars");
      for (let i = 0; i < 70; i++) {
        const s = document.createElement("div");
        s.className = "star";
        const size = Math.random() * 2 + 1;
        s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random() * 100}%;left:${Math.random() * 100}%;animation-duration:${2 + Math.random() * 4}s;animation-delay:${Math.random() * 5}s`;
        starsEl.appendChild(s);
      }

      setTimeout(() => {
        const letter = document.getElementById("letterDrop");
        letter.style.display = "block";

        // Auto-navigate after letter has floated for a moment
        setTimeout(() => {
          const overlay = document.getElementById("fadeOverlay");
          letter.classList.add("flying");
          setTimeout(() => overlay.classList.add("active"), 420);
          setTimeout(() => {
            window.location.href = "letter.html";
          }, 1100);
        }, 1400);
      }, 4800);
    </script>
  </body>
</html>
