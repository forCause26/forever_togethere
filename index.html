<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart Beat</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Cormorant+Garamond:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0d0a0f;
        font-family: "Cormorant Garamond", Georgia, serif;
        overflow: hidden;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        width: min(600px, 90vw);
        height: min(600px, 90vw);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(180, 30, 60, 0.12) 0%,
          transparent 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: ambientPulse 1.7s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes ambientPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        25% {
          transform: translate(-50%, -50%) scale(1.25);
          opacity: 1;
        }
        40% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.6;
        }
        60% {
          transform: translate(-50%, -50%) scale(1.2);
          opacity: 0.95;
        }
      }

      .particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .particle {
        position: absolute;
        bottom: -20px;
        border-radius: 50%;
        background: rgba(220, 50, 80, 0.4);
        animation: floatUp linear infinite;
      }
      .particle:nth-child(1) {
        left: 15%;
        width: 3px;
        height: 3px;
        animation-duration: 8s;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        left: 28%;
        width: 5px;
        height: 5px;
        animation-duration: 11s;
        animation-delay: 2s;
        background: rgba(220, 50, 80, 0.25);
      }
      .particle:nth-child(3) {
        left: 42%;
        width: 2px;
        height: 2px;
        animation-duration: 9s;
        animation-delay: 4.5s;
      }
      .particle:nth-child(4) {
        left: 58%;
        width: 4px;
        height: 4px;
        animation-duration: 13s;
        animation-delay: 1s;
        background: rgba(200, 30, 60, 0.3);
      }
      .particle:nth-child(5) {
        left: 70%;
        width: 3px;
        height: 3px;
        animation-duration: 10s;
        animation-delay: 3s;
      }
      .particle:nth-child(6) {
        left: 82%;
        width: 2px;
        height: 2px;
        animation-duration: 7s;
        animation-delay: 6s;
        background: rgba(220, 50, 80, 0.2);
      }
      .particle:nth-child(7) {
        left: 36%;
        width: 6px;
        height: 6px;
        animation-duration: 14s;
        animation-delay: 0.5s;
        background: rgba(180, 20, 50, 0.15);
      }
      .particle:nth-child(8) {
        left: 90%;
        width: 3px;
        height: 3px;
        animation-duration: 9s;
        animation-delay: 5s;
      }
      @keyframes floatUp {
        0% {
          transform: translateY(0) translateX(0) scale(1);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 0.3;
        }
        100% {
          transform: translateY(-100vh) translateX(30px) scale(0.4);
          opacity: 0;
        }
      }

      .container {
        text-align: center;
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      .label-top {
        font-size: clamp(10px, 3vw, 12px);
        font-weight: 300;
        letter-spacing: 0.35em;
        color: rgba(220, 80, 100, 0.5);
        text-transform: uppercase;
        margin-bottom: clamp(16px, 5vw, 32px);
        opacity: 0;
        animation: fadeInDown 1.2s ease forwards 0.3s;
      }
      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .heart-wrapper {
        position: relative;
        width: clamp(90px, 35vw, 140px);
        height: clamp(90px, 35vw, 140px);
        cursor: pointer;
        opacity: 0;
        animation: fadeInScale 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards
          0.6s;
      }
      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0.5);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .ring {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        border: 1px solid rgba(200, 40, 70, 0.3);
        animation: ringPulse 1.7s ease-out infinite;
        pointer-events: none;
      }
      .ring:nth-child(2) {
        animation-delay: 0.2s;
        border-color: rgba(200, 40, 70, 0.15);
      }
      @keyframes ringPulse {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        30% {
          opacity: 1;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      .heart-svg {
        width: 85%;
        height: 85%;
        position: absolute;
        top: 7.5%;
        left: 7.5%;
        animation: heartbeat 1.7s ease-in-out infinite;
        filter: drop-shadow(0 0 18px rgba(200, 30, 60, 0.6))
          drop-shadow(0 0 40px rgba(180, 10, 40, 0.3));
        transition: filter 0.3s ease;
      }
      .heart-wrapper:hover .heart-svg,
      .heart-wrapper:active .heart-svg {
        filter: drop-shadow(0 0 28px rgba(220, 50, 80, 0.9))
          drop-shadow(0 0 60px rgba(200, 20, 50, 0.5));
      }
      .heart-wrapper:hover .heart-inner,
      .heart-wrapper:active .heart-inner {
        fill: #ff3a5c;
      }
      .heart-inner {
        fill: #c8203c;
        transition: fill 0.3s ease;
      }
      .heart-sheen {
        fill: rgba(255, 255, 255, 0.12);
      }
      @keyframes heartbeat {
        0% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.22);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.16);
        }
        70% {
          transform: scale(1);
        }
        100% {
          transform: scale(1);
        }
      }

      .burst {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
      }
      .burst span {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #e8304e;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
      }
      .heart-wrapper.clicked .burst span {
        animation: burstOut 0.5s ease-out forwards;
      }
      .burst span:nth-child(1) {
        --angle: 0deg;
      }
      .burst span:nth-child(2) {
        --angle: 45deg;
      }
      .burst span:nth-child(3) {
        --angle: 90deg;
      }
      .burst span:nth-child(4) {
        --angle: 135deg;
      }
      .burst span:nth-child(5) {
        --angle: 180deg;
      }
      .burst span:nth-child(6) {
        --angle: 225deg;
      }
      .burst span:nth-child(7) {
        --angle: 270deg;
      }
      .burst span:nth-child(8) {
        --angle: 315deg;
      }
      @keyframes burstOut {
        0% {
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0)
            scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) rotate(var(--angle)) translateX(60px)
            scale(0);
          opacity: 0;
        }
      }

      .headline {
        margin-top: clamp(24px, 6vw, 44px);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-size: clamp(20px, 6vw, 28px);
        font-weight: 400;
        font-style: oblique;
        color: rgba(255, 240, 242, 0.9);
        letter-spacing: 0.02em;
        opacity: 0;
        animation: fadeInUp 1s ease forwards 1s;
      }
      .headline em {
        font-style: normal;
        color: #e03050;
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .subtitle {
        margin-top: clamp(8px, 3vw, 14px);
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-size: clamp(10px, 3vw, 13px);
        font-weight: 300;
        letter-spacing: 0.2em;
        color: rgba(220, 180, 185, 0.45);
        text-transform: uppercase;
        opacity: 0;
        animation: fadeInUp 1s ease forwards 1.3s;
      }

      .ekg-wrap {
        margin-top: clamp(20px, 5vw, 36px);
        width: clamp(140px, 50vw, 200px);
        opacity: 0;
        animation: fadeInUp 1s ease forwards 1.5s;
      }
      .ekg-path {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation:
          ekgDraw 1.2s ease forwards 1.8s,
          ekgLoop 1.7s linear 3s infinite;
      }
      @keyframes ekgDraw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes ekgLoop {
        0% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        80% {
          stroke-dashoffset: -400;
          opacity: 0.8;
        }
        81% {
          stroke-dashoffset: 400;
          opacity: 0;
        }
        100% {
          stroke-dashoffset: 400;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>
    <div class="container">
      <div class="heart-wrapper" id="heart" onclick="clickHeart()">
        <div class="ring"></div>
        <div class="ring"></div>
        <svg
          class="heart-svg"
          viewBox="0 0 100 90"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            class="heart-inner"
            d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C37 5 45 10 50 18 C55 10 63 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85Z"
          />
          <path
            class="heart-sheen"
            d="M22 14 C26 10 33 9 38 13 C34 9 27 8 22 14Z"
          />
        </svg>
        <div class="burst">
          <span></span><span></span><span></span><span></span> <span></span
          ><span></span><span></span><span></span>
        </div>
      </div>
      <h2 class="headline">Click the <em>Heart</em></h2>
      <p class="subtitle">and feel something</p>
      <div class="ekg-wrap">
        <svg
          width="100%"
          viewBox="0 0 200 40"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            class="ekg-path"
            d="M0 20 L40 20 L50 20 L58 5 L64 35 L70 12 L76 28 L82 20 L160 20 L200 20"
            stroke="rgba(200,40,65,0.6)"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <script>
      function clickHeart() {
        const wrapper = document.getElementById("heart");
        wrapper.classList.remove("clicked");
        void wrapper.offsetWidth;
        wrapper.classList.add("clicked");
        const svg = wrapper.querySelector(".heart-svg");
        svg.style.animation = "none";
        svg.style.transform = "scale(1.5)";
        svg.style.transition = "transform 0.15s ease-out";
        setTimeout(() => {
          svg.style.transform = "scale(1)";
          setTimeout(() => {
            svg.style.transition = "";
            svg.style.animation = "";
          }, 300);
        }, 150);
        setTimeout(() => {
          window.location.href = "next.html";
        }, 600);
      }
    </script>
  </body>
</html>
